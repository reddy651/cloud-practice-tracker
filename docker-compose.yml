services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: practice_tracker
      MYSQL_USER: practice_user
      MYSQL_PASSWORD: practice_password
      MYSQL_ROOT_PASSWORD: root_password_change_me
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-upractice_user", "-ppractice_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: change-this-for-local
      DATABASE_URL: mysql+mysqlconnector://practice_user:practice_password@db:3306/practice_tracker
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_ACCOUNT_URL: ${AZURE_STORAGE_ACCOUNT_URL:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-practice-files}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-azure}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysqldata:
